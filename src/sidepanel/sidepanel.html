<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JiuwenSwarm</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* JiuwenSwarm default theme (light) — styles/themes/default/light.css */
      --bg: #f5f7f9;
      --surface: #ffffff;
      --border: #e4e4e7;
      --accent: #2563eb;
      --accent-hover: #3b82f6;
      --text: #191919;
      --text-dim: #777777;
      --green: #16a34a;
      --red: #dc2626;
      --header-h: 48px;
      --context-h: 36px;
      color-scheme: light;
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif; font-size: 13px; }
    body { display: flex; flex-direction: column; }

    /* ── Header ── */
    #header {
      display: flex; align-items: center; justify-content: space-between;
      height: var(--header-h); padding: 0 10px; gap: 6px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #header .logo { font-weight: 700; font-size: 14px; letter-spacing: .5px; flex-shrink: 0; }
    #header .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--red); transition: background .3s; flex-shrink: 0;
    }
    #header .status-dot.connected { background: var(--green); }

    #session-label {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: pointer; font-size: 12px; color: var(--text-dim);
    }
    #session-label:hover { color: var(--text); }

    /* ── Icon buttons ── */
    .icon-btn {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px;
      flex-shrink: 0; line-height: 1.4;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

    #new-session-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 4px;
      padding: 3px 8px; cursor: pointer; font-size: 12px; flex-shrink: 0;
    }

    /* ── Session picker dropdown ── */
    #session-picker {
      position: absolute; top: var(--header-h); left: 0; right: 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
      z-index: 20; display: none; max-height: 280px; overflow-y: auto;
    }
    #session-picker.open { display: block; }
    #session-picker .session-item {
      padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
    }
    #session-picker .session-item:hover { background: var(--border); }
    #session-picker .session-item.active { border-left: 3px solid var(--accent); }

    /* ── Session actions menu (⋯) ── */
    #session-actions-menu {
      position: absolute; top: var(--header-h); right: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      z-index: 30; display: none; min-width: 180px; overflow: hidden;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    #session-actions-menu.open { display: block; }
    .sa-item {
      display: block; width: 100%; text-align: left;
      background: none; border: none; color: var(--text);
      padding: 8px 14px; cursor: pointer; font-size: 12px;
    }
    .sa-item:hover { background: var(--border); }
    .sa-divider { height: 1px; background: var(--border); margin: 2px 0; }

    /* ── New session form ── */
    #new-session-form {
      display: none; flex-direction: column; gap: 6px;
      padding: 10px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #new-session-form.open { display: flex; }
    #nf-title {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 5px 8px; font-size: 13px; outline: none;
    }
    #nf-title:focus { border-color: var(--accent); }
    .nf-selects { display: flex; gap: 6px; }
    .nf-selects select {
      flex: 1; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 6px; font-size: 12px;
    }
    .nf-hint {
      font-size: 11px; color: var(--text-dim);
      padding: 4px 8px; background: var(--border); border-radius: 4px;
      display: none;
    }
    .nf-hint.visible { display: block; }
    .nf-actions { display: flex; gap: 6px; }
    .nf-actions button {
      flex: 1; padding: 5px; border-radius: 4px; cursor: pointer;
      font-size: 12px; border: none;
    }
    #nf-create-btn { background: var(--accent); color: #fff; }
    #nf-cancel-btn { background: var(--border); color: var(--text); }

    /* ── Context bar ── */
    #context-bar {
      display: flex; align-items: center; gap: 6px;
      height: var(--context-h); padding: 0 10px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0; overflow-x: auto;
    }
    #context-bar .pin-chip {
      display: flex; align-items: center; gap: 4px;
      background: var(--border); border-radius: 12px;
      padding: 2px 8px; font-size: 11px; white-space: nowrap;
      max-width: 140px; overflow: hidden; text-overflow: ellipsis;
    }
    #context-bar .pin-chip--warn { border: 1px solid var(--red); opacity: .85; }
    #context-bar .pin-chip button {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 11px; padding: 0;
    }
    #pin-btn {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 11px;
      flex-shrink: 0;
    }
    #pin-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Chat iframe ── */
    #chat-frame { flex: 1; border: none; width: 100%; min-height: 0; }
  </style>
</head>
<body>
  <div id="header">
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="logo">九文 Swarm</span>
      <span id="status-dot" class="status-dot"></span>
    </div>
    <span id="session-label" title="Click to switch session">No session</span>
    <button id="more-btn" class="icon-btn" title="Export / Import / Open in web app">⋯</button>
    <button id="new-session-btn">+ New</button>
  </div>

  <!-- Dropdowns (position: absolute, float over content) -->
  <div id="session-picker"></div>
  <div id="session-actions-menu">
    <button class="sa-item" id="sa-export-json">⬇ Export JSON</button>
    <button class="sa-item" id="sa-export-md">⬇ Export Markdown</button>
    <button class="sa-item" id="sa-import">⬆ Import session…</button>
    <div class="sa-divider"></div>
    <button class="sa-item" id="sa-open-web">↗ Open in web app</button>
  </div>

  <!-- Hidden file input for import -->
  <input id="import-input" type="file" accept=".json" style="display:none" />

  <!-- New session form (inline, appears below header) -->
  <div id="new-session-form">
    <input id="nf-title" type="text" placeholder="Session name…" autocomplete="off" />
    <div class="nf-selects">
      <select id="nf-template">
        <option value="">No template</option>
        <option value="company-research">Company Research</option>
        <option value="paper-review">Paper Review</option>
        <option value="due-diligence">Due Diligence</option>
      </select>
      <select id="nf-mode">
        <option value="research">Research</option>
        <option value="chat">Chat</option>
        <option value="summarize">Summarize</option>
        <option value="compare">Compare</option>
      </select>
    </div>
    <div id="nf-hint" class="nf-hint"></div>
    <div class="nf-actions">
      <button id="nf-create-btn">Create</button>
      <button id="nf-cancel-btn">Cancel</button>
    </div>
  </div>

  <div id="context-bar">
    <button id="pin-btn">📌 Pin page</button>
    <div id="pin-chips"></div>
  </div>

  <iframe id="chat-frame" src="../webview/chat.html" sandbox="allow-scripts allow-same-origin"></iframe>

  <script type="module" src="index.js"></script>
</body>
</html>
